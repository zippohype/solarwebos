<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SolarOS web</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="desktop" class="desktop">
    <!-- Background wallpaper -->
    <div id="wallpaper" class="wallpaper"></div>

    <!-- Start menu -->
    <div id="start-menu" class="start-menu hidden" role="menu" aria-label="Start menu">
      <div class="start-search">
        <input id="start-search-input" placeholder="Search apps..." aria-label="Search apps" />
      </div>
      <div class="start-list" id="start-list" role="list"></div>
    </div>

    <!-- Taskbar -->
    <div id="taskbar" class="taskbar" role="navigation" aria-label="Taskbar">
      <div class="taskbar-left">
        <button id="start-button" class="start-button" aria-label="Start">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <rect x="3" y="3" width="8" height="8" fill="white" />
            <rect x="13" y="3" width="8" height="8" fill="white" opacity="0.85"/>
            <rect x="3" y="13" width="8" height="8" fill="white" opacity="0.6"/>
            <rect x="13" y="13" width="8" height="8" fill="white" opacity="0.4"/>
          </svg>
        </button>
      </div>

      <div id="taskbar-center" class="taskbar-center" role="toolbar" aria-label="Running apps"></div>

      <div class="taskbar-right">
        <div id="clock" class="clock" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <!-- Alt-Tab overlay -->
  <div id="altTabOverlay" class="alt-tab hidden" aria-hidden="true"></div>

  <!-- Window template (cloned by JS) -->
  <template id="window-template">
    <div class="window" role="dialog" aria-label="window">
      <div class="window-header" tabindex="0">
        <div class="window-title"></div>
        <div class="window-controls">
          <button class="btn-min" title="Minimize" aria-label="Minimize">—</button>
          <button class="btn-max" title="Maximize" aria-label="Maximize">☐</button>
          <button class="btn-close" title="Close" aria-label="Close">✕</button>
        </div>
      </div>
      <div class="window-body"></div>
      <div class="resize-handle" aria-hidden="true"></div>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
