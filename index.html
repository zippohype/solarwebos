<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Solarwebos</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Left taskbar -->
  <aside id="taskbar" aria-label="Left taskbar">
    <div id="taskbar-top">
      <div id="app-list" role="list"></div>
    </div>

    <div id="taskbar-bottom">
      <!-- kept empty intentionally -->
    </div>
  </aside>

  <!-- Topbar -->
  <header id="topbar" role="banner">
    <div class="topbar-left">
      <strong>MyShell</strong>
    </div>
    <div class="topbar-right" role="status" aria-live="polite">
      <div id="clock">00:00:00</div>
      <div id="date">Loading date…</div>
    </div>
  </header>

  <!-- Main workspace -->
  <main id="workspace" tabindex="-1" role="main"></main>

  <script src="script.js"></script>
</body>
</html>
